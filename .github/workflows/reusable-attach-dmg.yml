name: Attach DMG
on:
  workflow_call:
    inputs:
      tag:
        description: Release to attach build/Soundboard.dmg to
        type: string
        required: true

jobs:
  attach:
    name: make upload-dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Soundboard.dmg
          path: build
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: make upload-dmg TAG="$TAG"
