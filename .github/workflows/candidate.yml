# Every merge to master: rebuild the DMG and refresh the "Release Candidate" pre-release
# (notes since the last release + the DMG).
name: Release Candidate
on:
  push:
    branches: [master]

# A newer merge supersedes the one in flight; both would move the same tag.
concurrency:
  group: release-candidate
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  notes:
    needs: build
    name: Update Release Candidate Notes
    permissions:
      id-token: write
      contents: write
    uses: danielebra/simple-release-notes/.github/workflows/reusable-update-release-candidate-notes.yml@v0.3
    with:
      branch-with-candidate-code: master

  upload:
    needs: notes
    name: Attach DMG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Soundboard.dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload release-candidate Soundboard.dmg --clobber -R "$GITHUB_REPOSITORY"
